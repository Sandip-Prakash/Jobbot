name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libreoffice-writer fonts-crosextra-carlito poppler-utils
      - run: pip install -e ".[dev]" && python -m playwright install --with-deps chromium
      - run: python -m pytest -q
