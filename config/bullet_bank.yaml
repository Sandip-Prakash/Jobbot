# Approved bullet bank. Every claim here comes verbatim from Sandip's own resumes
# (Axon Air PDF = "pdf", Amazon Outbound PMM DOCX = "docx").
# approved:false => never used until Sandip signs off. Only Sandip flips that flag.
# "short" = a trimmed alternative used ONLY if the resume spills past one page.
# "pitch" = one-clause version for outreach (numbers in it are the only numbers outreach may use).

roles:
  arya:      {count: 3, titles: ["Product Marketing & Growth (GTM Strategy & Product Marketing)", "Product Marketing & Growth"]}
  samsung:   {count: 1, titles: ["Product Management Consultant, Cornell BigCo Studio"]}
  millennial: {count: 2, titles: ["Product Marketing Lead & Business Head (Product Marketing Manager)", "Head of Business & Marketing Strategy"]}
  spi:       {count: 2, titles: ["Project Manager, AI Product"]}
  kutung:    {count: 2, titles: ["Head of Marketing and Co-Founder"]}
  gm:        {count: 1, titles: ["Software Engineering"]}   # GM title is never changed
  products:  {count: 2}

# families: pmm | growth | product. Summary opens with the target job title.
summaries:
  pmm: "{title} and ex-GM engineer with 8+ years across engineering, product & marketing; owns pricing, packaging, launches & sales enablement that drive pipeline. Cornell MBA with Distinction (Top 10%)."
  growth: "{title} and ex-GM engineer with 8+ years across engineering, product & marketing; runs segmented email, push & WhatsApp campaigns, event-led acquisition & GenAI content workflows, measured on conversion & revenue. Cornell MBA (Top 10%)."
  product: "{title} and ex-GM engineer with 8+ years across engineering, product & marketing; leads 0→1 discovery, ICPs, MVP scope & success metrics from customer research. Cornell MBA with Distinction (Top 10%)."
summaries_short:
  pmm: "{title}, ex-GM engineer, 8+ years across engineering, product & marketing; owns pricing, packaging, launches & enablement. Cornell MBA (Top 10%)."
  growth: "{title}, ex-GM engineer, 8+ years across engineering, product & marketing; runs email, push & WhatsApp campaigns and event-led acquisition. Cornell MBA (Top 10%)."
  product: "{title}, ex-GM engineer, 8+ years across engineering, product & marketing; leads 0→1 discovery, ICPs & MVP scope. Cornell MBA (Top 10%)."

# Last line of the resume. "label" is bold, "text" follows. Must fit on ONE line.
skills:
  pmm:     {label: Skills, text: ": Pricing & packaging, GTM planning, launches, sales enablement & playbooks, partner/channel GTM, HubSpot, SQL"}
