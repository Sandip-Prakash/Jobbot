<!doctype html><html><body>
<form id="application_form" onsubmit="event.preventDefault(); document.body.innerHTML='<h1>Thank you for applying</h1>'">
  <label for="first_name">First Name *</label><input id="first_name" name="first_name" type="text" required>
  <label for="last_name">Last Name *</label><input id="last_name" name="last_name" type="text" required>
  <label for="email">Email *</label><input id="email" name="email" type="email" required>
  <label for="phone">Phone</label><input id="phone" name="phone" type="tel">
  <label for="resume">Resume/CV *</label><input id="resume" type="file" required>
  <label for="q1">LinkedIn Profile</label><input id="q1" type="text">
  <label for="q2">Are you legally authorized to work in the United States? *</label>
  <select id="q2" required><option value="">--</option><option>Yes</option><option>No</option></select>
  <fieldset><legend>Will you now or in the future require sponsorship? *</legend>
    <input type="radio" id="s_y" name="sp" value="yes" required><label for="s_y">Yes</label>
    <input type="radio" id="s_n" name="sp" value="no"><label for="s_n">No</label></fieldset>
  <label for="g">Gender</label><select id="g"><option value="">--</option><option>Male</option><option>Female</option><option>Decline to self-identify</option></select>
  <button type="submit">Submit Application</button>
</form></body></html>
