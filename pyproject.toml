[project]
name = "jobbot"
version = "0.1.0"
description = "Job application agent: discover, filter, score, tailor, apply, outreach, log."
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "pyyaml>=6", "lxml>=5", "playwright>=1.49"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jobbot = "jobbot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
